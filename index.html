<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qk4 Census Community Characteristics Portal</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </head>
  <body>
    <h2>Qk4 Census Community Characteristics Portal</h2>

    <div class="controls">
      <div>
        <label for="stateSelect">State:</label>
        <select id="stateSelect">
          <option value="">-- Select State --</option>
        </select>
      </div>

      <div>
        <label for="countySelect">County:</label>
        <select id="countySelect" disabled>
          <option value="">-- Select County --</option>
        </select>
      </div>

      <button id="downloadAllBtn" disabled>Download All Data (.ZIP)</button>
    </div>

    <div id="reportContainer">
      <p>Please select a state and county to generate reports.</p>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
